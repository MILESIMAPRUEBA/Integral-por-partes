<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauss-Jordan Unificado</title>
    <style>
        * { box-sizing: border-box; }

        /* Fondo Animado con gradiente en movimiento (Tonos Azules) */
        @keyframes fondoAnimado {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; 
            padding: 12px; 
            background: linear-gradient(-45deg, #001f3f, #0074d9, #7fdbff, #001122);
            background-size: 400% 400%;
            animation: fondoAnimado 12s ease infinite;
            font-size: 14px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container { 
            background-color: rgba(214, 234, 248, 0.9); /* Azul traslúcido suave */
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 15px; 
            max-width: 100%;
            width: 480px;
            border: 3px solid #000000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        h1 { 
            text-align: center; 
            color: #000000; 
            font-size: 1.6rem; 
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Menu superior para cambiar de modo */
        .menu-cambio {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            width: 480px;
            max-width: 100%;
        }

        .menu-cambio button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 3px solid #000000;
            border-radius: 10px;
            background: #ffffff;
            color: #000000;
            box-shadow: 0 4px 0 #000000;
            transition: all 0.2s ease;
        }

        .menu-cambio button:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #000000;
        }

        .menu-cambio button.activo {
            background: #0074d9;
            color: #ffffff;
        }

        .menu-cambio button.activo:hover {
            background: #0056a3;
        }

        .fila { 
            display: flex; 
            gap: 5px; 
            margin-bottom: 8px; 
            align-items: center;
        }

        .fila span { 
            min-width: 55px; 
            font-size: 13px; 
            color: #000000;
            font-weight: bold;
        }

        input { 
            width: 100%; 
            padding: 8px 4px; 
            font-size: 14px; 
            text-align: center; 
            border: 2px solid #000000; 
            border-radius: 6px; 
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
        }

        input:focus { 
            border-color: #2ecc71; 
            outline: none; 
        }

        /* Botones Principales (Verde Claro) */
        button.action-btn { 
            background: #2ecc71; 
            color: #000000; 
            border: 3px solid #000000; 
            padding: 12px; 
            font-size: 1.1rem; 
            font-weight: bold;
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            margin: 6px 0; 
            box-shadow: 0 4px 0 #000000;
            transition: all 0.2s ease;
        }

        button.action-btn:hover { 
            background: #58d68d; 
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #000000;
        }

        button.action-btn:active { 
            transform: translateY(2px);
            box-shadow: 0 2px 0 #000000;
        }

        /* Botón secundario (Verde más oscuro) */
        button.btn-sec { 
            background: #27ae60; 
        }

        .paso { 
            background: #ffffff; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 2px solid #000000;
            border-left: 6px solid #2ecc71; 
            font-size: 12px;
            color: #000000;
        }

        .matriz { 
            font-family: monospace; 
            font-size: 11px; 
            overflow-x: auto;
            white-space: pre;
            line-height: 1.4;
            background: #f4f6f7;
            padding: 6px;
            border-radius: 4px;
            margin-top: 4px;
            color: #000000;
        }

        .resultado { 
            background: #2ecc71; 
            color: #000000; 
            padding: 12px; 
            border: 3px solid #000000;
            border-radius: 10px; 
            text-align: center; 
            font-weight: bold;
            margin-top: 12px;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 #000000;
        }

        .error { 
            background: #e74c3c; 
            color: white; 
            padding: 12px; 
            border: 3px solid #000000;
            border-radius: 10px; 
            margin-top: 12px;
            font-weight: bold;
            text-align: center;
        }

        /* Clases para ocultar la columna Z y la Fila 3 en modo 2x2 */
        .modo-2x2 .col-z, .modo-2x2 .fila-3 {
            display: none !important;
        }
    </style>
</head>
<body id="cuerpo" class="modo-3x3">

    <div class="menu-cambio">
        <button id="selector-3x3" class="activo" onclick="cambiarSistema(3)">Elegir 3x3</button>
        <button id="selector-2x2" onclick="cambiarSistema(2)">Elegir 2x2</button>
    </div>

    <div class="container">
        <h1 id="titulo-dinamico">Gauss-Jordan 3x3</h1>
        
        <div class="fila">
            <span>Ec. 1:</span>
            <input type="text" id="a11" placeholder="x" value="3"> 
            <input type="text" id="a12" placeholder="y" value="2"> 
            <input type="text" id="a13" class="col-z" placeholder="z" value="1"> 
            <input type="text" id="b1" placeholder="=" value="6">
        </div>
        <div class="fila">
            <span>Ec. 2:</span>
            <input type="text" id="a21" placeholder="x" value="4"> 
            <input type="text" id="a22" placeholder="y" value="1"> 
            <input type="text" id="a23" class="col-z" placeholder="z" value="3"> 
            <input type="text" id="b2" placeholder="=" value="8">
        </div>
        <div class="fila fila-3">
            <span>Ec. 3:</span>
            <input type="text" id="a31" placeholder="x" value="1"> 
            <input type="text" id="a32" placeholder="y" value="2"> 
            <input type="text" id="a33" class="col-z" placeholder="z" value="-1"> 
            <input type="text" id="b3" placeholder="=" value="2">
        </div>
        
        <button class="action-btn" onclick="resolver()">Calcular</button>
        <button class="action-btn btn-sec" onclick="limpiar()">Limpiar</button>
        <div id="proceso"></div>
        <div id="resultado"></div>
    </div>

    <script>
        let sistemaActual = 3;

        class Frac {
            constructor(n, d = 1) {
                if(typeof n === 'string') {
                    n = n.trim();
                    if(n.includes('/')) {
                        let p = n.split('/');
                        n = parseFloat(p[0]);
                        d = parseFloat(p[1]);
                    } else {
                        n = parseFloat(n);
                    }
                }
                if(d === 0) throw new Error("División por cero");
                if(isNaN(n) || isNaN(d)) { n = 0; d = 1; }
                
                let g = this.mcd(Math.abs(n), Math.abs(d));
                this.n = Math.round(n / g) * (d < 0? -1 : 1);
                this.d = Math.round(Math.abs(d) / g);
            }
            
            mcd(a, b) { return b? this.mcd(b, a % b) : a; }
            
            toString() {
                if(this.d === 1) return this.n.toString();
                if(this.n === 0) return "0";
                return this.n + "/" + this.d;
            }
            
            suma(o) { return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
            resta(o) { return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
            mult(o) { return new Frac(this.n * o.n, this.d * o.d); }
            div(o) { return new Frac(this.n * o.d, this.d * o.n); }
            esCero() { return this.n === 0; }
            val() { return this.n / this.d; }
        }

        function cambiarSistema(tipo) {
            sistemaActual = tipo;
            const cuerpo = document.getElementById('cuerpo');
            const titulo = document.getElementById('titulo-dinamico');
            const btn3 = document.getElementById('selector-3x3');
            const btn2 = document.getElementById('selector-2x2');

            limpiar();

            if (tipo === 3) {
                cuerpo.className = "modo-3x3";
                titulo.textContent = "Gauss-Jordan 3x3";
                btn3.classList.add('activo');
                btn2.classList.remove('activo');
                
                // Valores iniciales para 3x3
                document.getElementById('a11').value = "3"; document.getElementById('a12').value = "2"; document.getElementById('a13').value = "1"; document.getElementById('b1').value = "6";
                document.getElementById('a21').value = "4"; document.getElementById('a22').value = "1"; document.getElementById('a23').value = "3"; document.getElementById('b2').value = "8";
                document.getElementById('a31').value = "1"; document.getElementById('a32').value = "2"; document.getElementById('a33').value = "-1"; document.getElementById('b3').value = "2";
            } else {
                cuerpo.className = "modo-2x2";
                titulo.textContent = "Gauss-Jordan 2x2";
                btn2.classList.add('activo');
                btn3.classList.remove('activo');

                // Valores iniciales para 2x2
                document.getElementById('a11').value = "2"; document.getElementById('a12').value = "3"; document.getElementById('b1').value = "12";
                document.getElementById('a21').value = "1"; document.getElementById('a22').value = "-1"; document.getElementById('b2').value = "1";
            }
            resolver();
        }

        function printM(m, t) {
            let h = `<div class="paso"><b>${t}</b><div class="matriz">`;
            for(let i = 0; i < sistemaActual; i++) {
                if(sistemaActual === 3) {
                    h += `[${m[i][0].toString().padStart(6)} ${m[i][1].toString().padStart(6)} ${m[i][2].toString().padStart(6)} |${m[i][3].toString().padStart(6)}]\n`;
                } else {
                    h += `[${m[i][0].toString().padStart(6)} ${m[i][1].toString().padStart(6)} |${m[i][2].toString().padStart(6)}]\n`;
                }
            }
            return h + `</div></div>`;
        }

        function resolver() {
            try {
                let m = [];
                let columnas = sistemaActual + 1;

                if(sistemaActual === 3) {
                    m = [
                        [new Frac(document.getElementById('a11').value), new Frac(document.getElementById('a12').value), new Frac(document.getElementById('a13').value), new Frac(document.getElementById('b1').value)],
                        [new Frac(document.getElementById('a21').value), new Frac(document.getElementById('a22').value), new Frac(document.getElementById('a23').value), new Frac(document.getElementById('b2').value)],
                        [new Frac(document.getElementById('a31').value), new Frac(document.getElementById('a32').value), new Frac(document.getElementById('a33').value), new Frac(document.getElementById('b3').value)]
                    ];
                } else {
                    m = [
                        [new Frac(document.getElementById('a11').value), new Frac(document.getElementById('a12').value), new Frac(document.getElementById('b1').value)],
                        [new Frac(document.getElementById('a21').value), new Frac(document.getElementById('a22').value), new Frac(document.getElementById('b2').value)]
                    ];
                }
                
                let proceso = document.getElementById('proceso');
                let resultado = document.getElementById('resultado');
                proceso.innerHTML = printM(m, "Inicio");
                resultado.innerHTML = "";
                
                for(let i = 0; i < sistemaActual; i++) {
                    let maxR = i;
                    for(let k = i+1; k < sistemaActual; k++) {
                        if(Math.abs(m[k][i].val()) > Math.abs(m[i][i].val())) maxR = k;
                    }
                    if(maxR !== i) {
                        [m[i], m[maxR]] = [m[maxR], m[i]];
                        proceso.innerHTML += printM(m, `R${i+1}↔️R${maxR+1}`);
                    }
                    
                    if(m[i][i].esCero()) {
                        resultado.innerHTML = `<div class="error">Sin solución única</div>`;
                        return;
                    }
                    
                    let p = m[i][i];
                    for(let j = 0; j < columnas; j++) m[i][j] = m[i][j].div(p);
                    proceso.innerHTML += printM(m, `R${i+1}/${p.toString()}`);
                    
                    for(let k = 0; k < sistemaActual; k++) {
                        if(k !== i && !m[k][i].esCero()) {
                            let fac = m[k][i];
                            for(let j = 0; j < columnas; j++) m[k][j] = m[k][j].resta(fac.mult(m[i][j]));
                            proceso.innerHTML += printM(m, `R${k+1}-${fac.toString()}R${i+1}`);
                        }
                    }
                }
                
                if(sistemaActual === 3) {
                    resultado.innerHTML = `<div class="resultado">x = ${m[0][3].toString()}, &nbsp; y = ${m[1][3].toString()}, &nbsp; z = ${m[2][3].toString()}</div>`;
                } else {
                    resultado.innerHTML = `<div class="resultado">x = ${m[0][2].toString()}, &nbsp; y = ${m[1][2].toString()}</div>`;
                }
            } catch(e) {
                document.getElementById('resultado').innerHTML = `<div class="error">Error: ${e.message}</div>`;
            }
        }
        
        function limpiar() {
            document.querySelectorAll('input').forEach(i => i.value = '');
            document.getElementById('proceso').innerHTML = '';
            document.getElementById('resultado').innerHTML = '';
        }
        
        window.onload = resolver;
    </script>
</body>
</html>
