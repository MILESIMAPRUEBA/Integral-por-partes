<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Integrales por Partes - Prepa</title>
    <style>
        /* Fondo Animado con gradiente rosado en movimiento */
        @keyframes fondoAnimado {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #feada6, #f3a6c8);
            background-size: 400% 400%;
            animation: fondoAnimado 12s ease infinite;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-sizing: border-box;
        }

        /* Botones Morados Estilizados */
        button {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
        }

        button:hover {
            background-color: #7b1fa2;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.4);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(138, 43, 226, 0.3);
        }

        /* Diseño en lista vertical */
        .button-group {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 12px;
            margin-top: 25px;
        }

        .button-group button, #inicio button {
            margin: 0;
            width: 100%;
            max-width: 340px;
            padding: 16px 20px; 
        }

        /* Botón volver con tono morado secundario */
        #btn-volver {
            background-color: #6a1b9a;
        }
        #btn-volver:hover {
            background-color: #4a148c;
        }

        /* Pantallas */
        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        /* Pantalla de Inicio */
        #inicio h1 {
            font-size: 2.8rem;
            margin-bottom: 30px;
            color: #4a148c;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        #inicio p {
            font-size: 1.1rem;
            color: #6a1b9a;
            margin-bottom: 25px;
        }

        /* Pantalla de Calculadora */
        h2 {
            color: #4a148c;
            margin-bottom: 20px;
        }

        select, input {
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            background-color: #ffffff;
            color: #333;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #8a2be2;
        }

        .opcion-bloque {
            background-color: rgba(138, 43, 226, 0.05);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid rgba(138, 43, 226, 0.15);
        }

        /* Contenedor de Resultados y Procedimientos */
        #resultado-box {
            margin-top: 25px;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e0e0e0;
            text-align: left;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        #resultado-box h3 {
            margin-top: 0;
            color: #4a148c;
            border-bottom: 2px dashed #f0f0f0;
            padding-bottom: 12px;
        }

        .paso {
            margin-bottom: 14px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #4f5d75;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="inicio" class="screen active">
            <h1>Integral por Partes</h1>
            <p>Aprende el método "Una Vaca Sin Cola Vestida De Uniforme" paso a paso</p>
            <div class="button-group">
                <button id="btn-comenzar">Calcular ya</button>
            </div>
        </div>

        <div id="calculadora" class="screen">
            <h2>Integración por Partes</h2>
            <p>Selecciona el modelo de función clásica para resolver:</p>
            
            <div class="opcion-bloque">
                <label for="tipo-partes"><b>Modelo: </b></label>
                <select id="tipo-partes">
                    <option value="exponencial">∫ x · e^(ax) dx</option>
                    <option value="coseno">∫ x · cos(ax) dx</option>
                    <option value="seno">∫ x · sin(ax) dx</option>
                </select>
            </div>

            <div id="inputs-dinamicos" class="opcion-bloque">
                </div>

            <div class="button-group">
                <button id="btn-calcular">Calcular por Partes</button>
                <button id="btn-volver">Volver</button>
            </div>

            <div id="resultado-box">
                <h3>Procedimiento estructurado (∫ u dv):</h3>
                <div id="pasos-partes"></div>
            </div>
        </div>

    </div>

    <script>
        // Navegación
        const pantallaInicio = document.getElementById('inicio');
        const pantallaCalculadora = document.getElementById('calculadora');
        const btnComenzar = document.getElementById('btn-comenzar');
        const btnVolver = document.getElementById('btn-volver');
        const btnCalcular = document.getElementById('btn-calcular');
        const tipoPartes = document.getElementById('tipo-partes');
        const inputsDinamicos = document.getElementById('inputs-dinamicos');
        const resultadoBox = document.getElementById('resultado-box');
        const pasosDiv = document.getElementById('pasos-partes');

        btnComenzar.addEventListener('click', () => {
            pantallaInicio.classList.remove('active');
            pantallaCalculadora.classList.add('active');
            renderInputs();
        });

        btnVolver.addEventListener('click', () => {
            pantallaCalculadora.classList.remove('active');
            pantallaInicio.classList.add('active');
            resultadoBox.style.display = 'none';
        });

        function renderInputs() {
            resultadoBox.style.display = 'none';
            const opcion = tipoPartes.value;
            
            if (opcion === 'exponencial') {
                inputsDinamicos.innerHTML = `
                    <span>∫ x · e^(</span>
                    <input type="number" id="val-a" value="2" style="width: 60px;" placeholder="a">
                    <span>x) dx</span>
                `;
            } else if (opcion === 'coseno' || opcion === 'seno') {
                inputsDinamicos.innerHTML = `
                    <span>∫ x · ${opcion}(</span>
                    <input type="number" id="val-a" value="3" style="width: 60px;" placeholder="a">
                    <span>x) dx</span>
                `;
            }
        }

        tipoPartes.addEventListener('change', renderInputs);

        // Motor de cálculo para Integración por Partes
        btnCalcular.addEventListener('click', () => {
            const opcion = tipoPartes.value;
            let htmlPasos = "";
            let resultadoFinal = "";

            const a = parseFloat(document.getElementById('val-a').value || 1);

            // Pasos estándar de la definición ILATE para estos casos
            htmlPasos += `<div class="paso"><b>Fórmula Base:</b> ∫ u dv = u·v - ∫ v du</div>`;
            htmlPasos += `<div class="paso"><b>Paso 1 (Identificar componentes):</b><br>
                          Usando la regla ILATE, elegimos la algebraica como 'u':<br>
                          • <b>u = x</b>  &rarr;  <b>du = dx</b></div>`;

            if (opcion === 'exponencial') {
                const fraccion = (1 / a).toFixed(2);
                const fraccionCuadrado = (1 / (a * a)).toFixed(2);

                htmlPasos += `
                    <div class="paso"><b>Paso 2 (Encontrar 'v' integrando dv):</b><br>
                    dv = e<sup>${a}x</sup> dx &rarr; <b>v = (1/${a})e<sup>${a}x</sup></b></div>
                    <div class="paso"><b>Paso 3 (Aplicar la vaca sin cola u·v - ∫ v du):</b><br>
                    = x · [ (1/${a})e<sup>${a}x</sup> ] - ∫ (1/${a})e<sup>${a}x</sup> dx</div>
                    <div class="paso"><b>Paso 4 (Resolver la última integral):</b><br>
                    La integral de (1/${a})e<sup>${a}x</sup> vuelve a dividir entre ${a}:<br>
                    = (x/${a})e<sup>${a}x</sup> - (1/${a * a})e<sup>${a}x</sup> + C</div>
                `;
                resultadoFinal = `(${fraccion}x - ${fraccionCuadrado})e<sup>${a}x</sup> + C`;

            } else if (opcion === 'coseno') {
                const fraccion = (1 / a).toFixed(2);
                const fraccionCuadrado = (1 / (a * a)).toFixed(2);

                htmlPasos += `
                    <div class="paso"><b>Paso 2 (Encontrar 'v' integrando dv):</b><br>
                    dv = cos(${a}x) dx &rarr; <b>v = (1/${a})sin(${a}x)</b></div>
                    <div class="paso"><b>Paso 3 (Aplicar la fórmula u·v - ∫ v du):</b><br>
                    = x · [ (1/${a})sin(${a}x) ] - ∫ (1/${a})sin(${a}x) dx</div>
                    <div class="paso"><b>Paso 4 (Resolver la última integral):</b><br>
                    La integral de sin(${a}x) es -cos(${a}x)/${a}. Por lo tanto, el signo cambia a positivo (- × - = +):<br>
                    = (x/${a})sin(${a}x) + (1/${a * a})cos(${a}x) + C</div>
                `;
                resultadoFinal = `${fraccion}x · sin(${a}x) + ${fraccionCuadrado}cos(${a}x) + C`;

            } else if (opcion === 'seno') {
                const fraccion = (1 / a).toFixed(2);
                const fraccionCuadrado = (1 / (a * a)).toFixed(2);

                htmlPasos += `
                    <div class="paso"><b>Paso 2 (Encontrar 'v' integrando dv):</b><br>
                    dv = sin(${a}x) dx &rarr; <b>v = -(1/${a})cos(${a}x)</b></div>
                    <div class="paso"><b>Paso 3 (Aplicar la fórmula u·v - ∫ v du):</b><br>
                    = x · [ -(1/${a})cos(${a}x) ] - ∫ [ -(1/${a})cos(${a}x) ] dx<br>
                    = -(x/${a})cos(${a}x) + (1/${a}) ∫ cos(${a}x) dx</div>
                    <div class="paso"><b>Paso 4 (Resolver la última integral):</b><br>
                    La integral de cos(${a}x) es sin(${a}x)/${a}:<br>
                    = -(x/${a})cos(${a}x) + (1/${a * a})sin(${a}x) + C</div>
                `;
                resultadoFinal = `-${fraccion}x · cos(${a}x) + ${fraccionCuadrado}sin(${a}x) + C`;
            }

            // Inyección del resultado final estilizado
            htmlPasos += `
                <div class="paso" style="font-size: 1.3rem; margin-top: 15px; border-top: 2px dashed #f0f0f0; padding-top: 15px;">
                    <b>Resultado F(x) = </b> <span style="color: #8a2be2; font-weight: bold;">${resultadoFinal}</span>
                </div>
            `;

            pasosDiv.innerHTML = htmlPasos;
            resultadoBox.style.display = 'block';
        });
    </script>
</body>
</html>
